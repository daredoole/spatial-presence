name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify version alignment
        run: |
          node -e 'const p=require("./package.json");const m=require("./custom_components/spatial_presence/manifest.json");if(p.version!==m.version)throw new Error(`version mismatch: ${p.version} != ${m.version}`)'
      - name: Package integration
        run: |
          cd custom_components
          zip -r ../spatial_presence.zip spatial_presence
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: spatial_presence.zip
          generate_release_notes: true
