name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify version alignment
        run: |
          node -e 'const p=require("./package.json");const m=require("./custom_components/spatial_presence/manifest.json");if(p.version!==m.version)throw new Error(`version mismatch: ${p.version} != ${m.version}`)'
      - name: Package integration
        run: |
          cd custom_components
          zip -r ../spatial_presence.zip spatial_presence
      - uses: softprops/action-gh-release@v2
        with:
          files: spatial_presence.zip
          generate_release_notes: true

